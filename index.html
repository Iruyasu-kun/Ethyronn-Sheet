<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethyronn Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Celestial Inkwell tokens
   The palette is the project's, carried over verbatim. Anything
   new below is expressed in OKLCH.
   ============================================================ */
:root{
  --ci-ink:#0C1526; --ci-midnight-blue:#141D2E; --ci-ink-raised:#182238;
  --ci-star-gold:#C2A368; --ci-aged-parchment:#E4D3B4; --ci-dusty-plum:#4A4066;
  --ci-forest-moss:#2F4945; --ci-celestial-silver:#99A4B0; --ci-starlight-lilac:#818DB8;

  --bg-page:var(--ci-ink);
  --surface-base:var(--ci-midnight-blue);
  --surface-card:var(--ci-ink-raised);
  --surface-raised:var(--ci-dusty-plum);
  --border-default:rgba(194,163,104,0.25);
  --border-strong:var(--ci-star-gold);
  --text-primary:var(--ci-aged-parchment);
  --text-secondary:var(--ci-celestial-silver);
  --text-accent:var(--ci-star-gold);
  --text-on-gold:var(--ci-ink);
  --accent:var(--ci-star-gold);
  --accent-soft:rgba(194,163,104,0.3);
  --accent-hover:#D2B57F;
  --focus-ring:rgba(194,163,104,0.55);
  --glow-gold:0 0 0 4px rgba(194,163,104,0.14);
  --state-danger:#8C4A46; --state-danger-text:#C98A85;
  --shadow-float:0 18px 48px rgba(6,11,22,0.65);
  --shadow-overlay:0 32px 80px rgba(6,11,22,0.78);

  --space-2xs:4px; --space-xs:8px; --space-sm:12px; --space-md:16px;
  --space-lg:24px; --space-xl:32px; --space-2xl:48px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-full:9999px;

  --dur-fast:120ms; --dur-base:200ms; --dur-slow:360ms;
  --ease-standard:cubic-bezier(0.22,0.61,0.36,1);
  --ease-enter:cubic-bezier(0.16,1,0.3,1);

  /* Annotation under a buffed attribute. The brief specified #4A4066, which
     measures about 1.5:1 on the card and is unreadable, so this is the same
     plum lifted to 4.6:1. Change this one value to move every annotation. */
  --buff-note:#9086C4;

  --font-ui:'Lora',Georgia,'Times New Roman',serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page)}
body{font-family:var(--font-ui);color:var(--text-primary);font-size:16px;line-height:24px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}

/* ============================================================
   Design system components
   ============================================================ */

/* ---- Button ---- */
.ci-btn{font-family:var(--font-ui);font-weight:600;display:inline-flex;align-items:center;
  justify-content:center;gap:var(--space-xs);border:1px solid transparent;
  border-radius:var(--radius-md);cursor:pointer;white-space:nowrap;text-decoration:none;
  transition-property:background-color,color,border-color,transform;
  transition-duration:var(--dur-fast);transition-timing-function:var(--ease-standard)}
.ci-btn--sm{font-size:14px;line-height:20px;padding:8px 16px}
.ci-btn--md{font-size:16px;line-height:24px;padding:12px 24px}
.ci-btn--lg{font-size:16px;line-height:24px;padding:16px 32px}
.ci-btn--primary{background:var(--accent);color:var(--text-on-gold);border-color:var(--accent)}
.ci-btn--primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.ci-btn--secondary{background:transparent;color:var(--text-accent);border-color:var(--border-strong)}
.ci-btn--secondary:hover:not(:disabled){background:var(--accent-soft)}
.ci-btn--ghost{background:transparent;color:var(--text-secondary);border-color:transparent}
.ci-btn--ghost:hover:not(:disabled){background:rgba(194,163,104,0.12);color:var(--text-primary)}
.ci-btn--danger{background:transparent;color:var(--state-danger-text);border-color:var(--state-danger)}
.ci-btn--danger:hover:not(:disabled){background:rgba(140,74,70,0.22)}
.ci-btn:active:not(:disabled){transform:translateY(1px)}
.ci-btn:disabled{opacity:0.4;cursor:not-allowed}
.ci-btn--full{width:100%}
.ci-btn svg{flex:0 0 auto}

/* ---- Field label, shared by Input, Select and MultiSelect ---- */
.ci-field{display:flex;flex-direction:column;gap:var(--space-xs);min-width:0}
.ci-label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;color:var(--text-accent)}

/* ---- Input ---- */
.ci-inputbox{display:flex;align-items:center;gap:var(--space-xs);
  background:rgba(12,21,38,0.6);border:1px solid var(--border-default);
  border-radius:var(--radius-md);padding:0 var(--space-md);
  transition:border-color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
.ci-inputbox:focus-within{border-color:var(--border-strong);box-shadow:var(--glow-gold)}
.ci-inputbox > input,.ci-inputbox > textarea{flex:1;min-width:0;background:transparent;border:none;
  outline:none;color:var(--text-primary);font-size:16px;line-height:24px;padding:12px 0}
.ci-inputbox > textarea{resize:vertical;padding:12px 0}
.ci-inputbox > input::placeholder,.ci-inputbox > textarea::placeholder{color:var(--text-secondary);opacity:0.7}

/* ---- Select ---- */
.ci-selectwrap{position:relative;display:flex}
.ci-select{appearance:none;width:100%;background:rgba(12,21,38,0.6);
  border:1px solid var(--border-default);border-radius:var(--radius-md);
  padding:12px 40px 12px var(--space-md);color:var(--text-primary);
  font-size:16px;line-height:24px;cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
.ci-select:hover{border-color:var(--border-strong)}
.ci-select:focus{outline:none;border-color:var(--border-strong);box-shadow:var(--glow-gold)}
.ci-select option{background:var(--surface-base);color:var(--text-primary)}
.ci-caret{position:absolute;right:var(--space-md);top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--text-accent);display:flex}

/* ---- Badge ---- */
.ci-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:14px;
  font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;
  border-radius:var(--radius-full);white-space:nowrap}
.ci-badge--gold{background:var(--accent-soft);color:var(--text-accent);border:1px solid rgba(194,163,104,0.45)}
.ci-badge--neutral{background:rgba(153,164,176,0.14);color:var(--text-secondary);border:1px solid rgba(153,164,176,0.3)}
.ci-badge--lilac{background:rgba(129,141,184,0.18);color:var(--ci-starlight-lilac);border:1px solid rgba(129,141,184,0.4)}
.ci-badge--moss{background:rgba(47,73,69,0.6);color:#9CC0AE;border:1px solid rgba(47,73,69,0.9)}
.ci-badge--danger{background:rgba(140,74,70,0.22);color:var(--state-danger-text);border:1px solid rgba(140,74,70,0.55)}

/* ---- Tabs ---- */
.ci-tabs{display:flex;gap:var(--space-xl);align-items:center;
  border-bottom:1px solid var(--border-default);overflow-x:auto;scrollbar-width:none}
.ci-tabs::-webkit-scrollbar{display:none}
.ci-tab{background:transparent;border:none;cursor:pointer;font-size:14px;line-height:20px;
  font-weight:400;color:var(--text-secondary);padding:0 0 12px;margin-bottom:-1px;
  border-bottom:2px solid transparent;white-space:nowrap;
  transition:color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}
.ci-tab:hover{color:var(--text-primary)}
.ci-tab[aria-selected="true"]{font-weight:600;color:var(--text-primary);border-bottom-color:var(--accent)}

/* ============================================================
   Sheet
   ============================================================ */

/* Fixed behind everything. Two washes, a two-scale starfield, real
   constellation figures and an armillary sphere. Scattered dots alone read
   as noise, so the figures carry the celestial and the dust fills between. */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky svg{width:100%;height:100%;display:block}

/* Envelopes the whole app: 8px outside, 16px inside. Corners are drawn, not
   bitmapped, so they take the gold token and stay crisp at any size. */
.frame{position:relative;z-index:1;margin:8px;padding:16px;min-height:calc(100vh - 16px)}
.frame::before{content:"";position:absolute;inset:0;pointer-events:none;
  border:1px solid var(--border-default);border-radius:var(--radius-lg)}
.corner{position:absolute;width:96px;height:96px;pointer-events:none;
  color:var(--ci-star-gold);opacity:0.85}
.corner svg{width:100%;height:100%;display:block}
/* The source ornament is drawn as a TOP-RIGHT corner: its rule runs left along
   the top and its tail drops down the right edge. TR is therefore untransformed,
   and the other three are mirrored off it. */
.corner.tr{top:0;right:0}
.corner.tl{top:0;left:0;transform:scaleX(-1)}
.corner.br{bottom:0;right:0;transform:scaleY(-1)}
.corner.bl{bottom:0;left:0;transform:scale(-1,-1)}
/* Clears the ornament so no control sits under the filigree. */
.body{position:relative;z-index:1;padding:60px 44px;max-width:1180px;margin:0 auto}

.topbar{display:flex;align-items:center;gap:var(--space-md);flex-wrap:wrap;
  padding-bottom:var(--space-lg);border-bottom:1px solid var(--border-default);
  margin-bottom:var(--space-lg)}
.rankdisc{width:46px;height:46px;flex:0 0 auto;border-radius:50%;
  border:1px solid var(--accent);background:var(--accent-soft);display:flex;
  align-items:center;justify-content:center;color:var(--text-accent);
  font-weight:700;font-size:18px}
.charname{font-size:20px;line-height:28px;font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:3px;text-transform:uppercase;
  color:var(--text-accent)}

/* Panels. Spacing varies by density rather than repeating one padding. */
.panel{background:var(--surface-card);border:1px solid var(--border-default);
  border-radius:var(--radius-lg);padding:var(--space-xl);margin-bottom:var(--space-md)}
.panel--tight{padding:var(--space-lg) var(--space-xl)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;
  gap:var(--space-md);flex-wrap:wrap;margin-bottom:var(--space-lg)}
.panel-title{font-size:24px;line-height:32px;font-weight:500;letter-spacing:-0.2px}
.panel-note{font-size:14px;line-height:20px;color:var(--text-secondary);max-width:68ch}
.subhead{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-secondary);font-weight:600}

.grid{display:grid;gap:var(--space-md)}
.g2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.row{padding:var(--space-lg) 0;border-top:1px solid rgba(194,163,104,0.12)}
.row:first-of-type{border-top:none}
.rowtop{display:flex;align-items:center;gap:var(--space-xs);flex-wrap:wrap;
  margin-bottom:var(--space-md)}

/* Stat table. Grid rows, not <table>: keeps markup free of table-parsing
   rules and lets each cell be a plain flex box. */
.tablewrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  border:1px solid var(--border-default);border-radius:var(--radius-md)}
.table{min-width:576px}
.thead,.trow{display:grid;grid-template-columns:96px repeat(5,minmax(92px,1fr))}
.thead{background:rgba(12,21,38,0.45);border-bottom:1px solid var(--border-default)}
.thead > div{padding:10px 12px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-secondary);font-weight:600;white-space:nowrap}
.trow{border-bottom:1px solid rgba(194,163,104,0.12)}
.trow:last-child{border-bottom:none}
.trow > div{display:flex;align-items:center;min-width:0}
.thead > div + div,.trow > div + div{border-left:1px solid rgba(194,163,104,0.12)}
.cellname{padding:10px 12px;font-weight:500;white-space:nowrap}
/* Borderless cells that only show their edge on hover or focus. */
.cell{width:100%;height:44px;padding:0 12px;background:transparent;
  border:1px solid transparent;color:var(--text-primary);font-size:14px;
  font-variant-numeric:tabular-nums;
  transition:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}
.cell:hover{background:rgba(194,163,104,0.06)}
.cell:focus{outline:none;background:rgba(194,163,104,0.09);border-color:var(--border-strong)}
.cell-ro{padding:10px 12px;font-variant-numeric:tabular-nums;color:var(--text-secondary)}
.cell-total{padding:10px 12px;font-variant-numeric:tabular-nums;color:var(--text-accent);font-weight:600}

/* Multi-select. Field and label match Select exactly so it never reads as a
   different kind of control sitting in a row of Selects. */
.ms{position:relative}
.ms-field{width:100%;padding:12px var(--space-md);display:flex;align-items:center;
  justify-content:space-between;gap:var(--space-xs);border-radius:var(--radius-md);
  background:rgba(12,21,38,0.6);border:1px solid var(--border-default);
  color:var(--text-primary);font-size:16px;line-height:24px;cursor:pointer;text-align:left;
  transition:border-color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
.ms-field:hover,.ms-field[aria-expanded="true"]{border-color:var(--border-strong)}
.ms-field[aria-expanded="true"]{box-shadow:var(--glow-gold)}
.ms-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-value.is-empty{color:var(--text-secondary)}
/* Outer radius = inner radius + padding: 4 + 8 = 12. */
.ms-panel{position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;padding:var(--space-xs);
  background:var(--surface-base);border:1px solid var(--border-strong);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-float);
  animation:rise var(--dur-fast) var(--ease-enter)}
.ms-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px;background:transparent;
  border:none;border-radius:var(--radius-sm);color:var(--text-primary);font-size:14px;
  cursor:pointer;text-align:left;transition:background-color var(--dur-fast) var(--ease-standard)}
.ms-opt:hover{background:rgba(194,163,104,0.1)}
.ms-box{flex:0 0 auto;width:18px;height:18px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;
  color:var(--text-on-gold);transition:background-color var(--dur-fast) var(--ease-standard)}
.ms-box[data-on="1"]{background:var(--accent)}
.ms-box svg{opacity:0;transition:opacity var(--dur-fast) var(--ease-standard)}
.ms-box[data-on="1"] svg{opacity:1}

/* Annotation under an attribute a piece of equipment is buffing. */
.buffnote{margin-top:var(--space-2xs);font-size:14px;font-weight:400;line-height:20px;
  color:var(--buff-note)}

/* Total damage. Medium label, bold number. */
.dmg{display:flex;gap:var(--space-xl);flex-wrap:wrap;margin-top:var(--space-2xs)}
.dmg-item{font-size:16px;font-weight:500;color:var(--text-secondary)}
.dmg-num{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}

.portrait{width:100%;aspect-ratio:2/3;border:1px solid var(--border-default);
  border-radius:var(--radius-lg);background:rgba(12,21,38,0.6);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
/* contain, not cover: the whole photo stays visible and centred whatever
   its aspect ratio, instead of being cropped to fill the 2:3 frame. */
.portrait img{width:100%;height:100%;object-fit:contain;object-position:center;
  display:block;outline:1px solid oklch(1 0 0 / 0.1);outline-offset:-1px}
.portrait-empty{color:var(--accent-soft);font-size:28px}

/* ---------- Vessels ----------
   Live HP and MP. Session state, so this lives on the Combat tab rather than
   in the Base stats reference table. */
.vessels{display:flex;gap:var(--space-xl);align-items:flex-end;flex-wrap:wrap;
  padding-bottom:var(--space-lg);margin-bottom:var(--space-lg);
  border-bottom:1px solid rgba(194,163,104,0.12)}
.vessel{display:flex;flex-direction:column;align-items:center;gap:var(--space-sm)}
.tube{width:36px;height:140px;border-radius:18px;position:relative;overflow:hidden;
  background:rgba(12,21,38,0.6);border:1px solid var(--border-default)}
/* Scaled, not resized: height is a layout property and animating it forces
   layout on every frame. */
.tube-fill{position:absolute;inset:0;transform-origin:bottom;
  transform:scaleY(var(--fill,0));
  transition:transform var(--dur-slow) var(--ease-standard)}
.tube-fill.hp{background:linear-gradient(to top,oklch(36% 0.07 25),oklch(56% 0.10 25))}
.tube-fill.mp{background:linear-gradient(to top,oklch(40% 0.05 268),oklch(64% 0.07 268))}
.vessel-label{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;
  color:var(--text-secondary)}
.vessel-label b{font-weight:700;color:var(--text-primary)}

/* Quick adjustments: a number and its Apply button read as one control. */
.quick{flex:1 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(164px,1fr));
  gap:var(--space-md)}
.quick-field{display:flex;flex-direction:column;gap:var(--space-xs);min-width:0}
.quick-row{display:flex;gap:var(--space-xs)}
.quick-row .ci-inputbox{flex:1 1 60px;min-width:0}
.quick-row .ci-inputbox > input{padding:9px 0;font-variant-numeric:tabular-nums}
.quick-row .ci-btn{flex:0 0 auto}

/* ---------- Battle state ----------
   Sits above the starfield but below the frame, so it tints the ground and
   never washes over text. */
.battle-veil{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  transition:opacity var(--dur-slow) var(--ease-standard);
  background:radial-gradient(ellipse at 50% 45%,transparent 30%,oklch(38% 0.10 25 / 0.34) 100%)}
[data-battle="1"] .battle-veil{opacity:1}
[data-battle="1"] .frame::before{border-color:oklch(55% 0.10 25 / 0.5)}
[data-battle="1"] .corner{color:oklch(66% 0.09 32)}

.bignum{font-size:36px;line-height:44px;font-weight:700;letter-spacing:-0.5px;
  font-variant-numeric:tabular-nums}
.breakline{display:flex;justify-content:space-between;gap:var(--space-md);font-size:14px;
  line-height:20px;color:var(--text-secondary);
  border-bottom:1px solid rgba(194,163,104,0.12);padding-bottom:var(--space-2xs)}
.breakline > span:last-child{font-variant-numeric:tabular-nums;color:var(--text-primary);white-space:nowrap}

.banner{padding:12px var(--space-md);border:1px solid var(--state-danger);
  background:rgba(140,74,70,0.22);border-radius:var(--radius-md);
  color:var(--state-danger-text);font-size:14px;margin-bottom:var(--space-lg)}

.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;
  justify-content:center;padding:var(--space-lg);background:rgba(12,21,38,0.82)}
.dialog{position:relative;width:100%;max-width:420px;padding:var(--space-xl);
  background:var(--surface-card);border:1px solid var(--border-default);
  border-radius:var(--radius-xl);box-shadow:var(--shadow-overlay);
  animation:rise var(--dur-base) var(--ease-enter)}
.dialog-close{position:absolute;top:12px;right:12px;width:40px;height:40px;display:flex;
  align-items:center;justify-content:center;background:transparent;border:none;
  border-radius:var(--radius-md);color:var(--text-accent);cursor:pointer;
  transition:background-color var(--dur-fast) var(--ease-standard)}
.dialog-close:hover{background:rgba(194,163,104,0.12)}
.toast{position:fixed;left:50%;bottom:var(--space-lg);transform:translateX(-50%);z-index:80;
  max-width:min(90vw,52ch);padding:12px var(--space-md);background:var(--surface-base);
  border:1px solid var(--accent);border-radius:var(--radius-md);box-shadow:var(--shadow-float);
  font-size:14px;animation:rise var(--dur-base) var(--ease-enter)}

.logline{display:flex;gap:var(--space-sm);flex-wrap:wrap;align-items:baseline;padding:10px 0;
  border-top:1px solid rgba(194,163,104,0.12);font-size:14px;line-height:20px}
.logtime{font-variant-numeric:tabular-nums;color:var(--text-secondary);font-size:12px}
.logtype{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--text-accent)}

.empty{padding:var(--space-xl) 0;text-align:center;color:var(--text-secondary);font-size:14px;
  line-height:20px}

.file-btn{display:inline-flex;align-items:center;justify-content:center}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(6px)}}

/* Touch pointers get a comfortable target even on the small button size. */
@media (pointer:coarse){
  .ci-btn--sm{min-height:44px}
  /* Padding added on top, so the active underline stays on the baseline. */
  .ci-tab{padding:10px 0 16px}
  .cell{height:48px}
  .ms-opt{padding:12px 8px}
}

@media (max-width:900px){
  .body{padding:44px 20px}
  .panel{padding:var(--space-lg)}
  .panel--tight{padding:var(--space-md) var(--space-lg)}
}
@media (max-width:768px){
  .corner{width:64px;height:64px}
  .body{padding:34px 10px}
}

  }, 0);

  function test(spec, id) {
    return spec === "core" ? ELEMENTS[id].kind === "core" : spec.indexOf(id) !== -1;
  }
  for (var i = 0; i < SPECIAL.length; i++) {
    var r = SPECIAL[i];
    if (test(r.a, a) && test(r.d, b)) {
      return {
        relation: r.rel,
        multiplier: r.rel === "advantage" ? MULT[r.m] : 0,
        reason: ELEMENTS[a].label + " against " + ELEMENTS[b].label

  var ga = ELEMENTS[a].group, gb = ELEMENTS[b].group;
  if (!ga || !gb || ga === gb) return { relation: "neutral", multiplier: 0, reason: "No relationship" };
  if (CYCLE[(CYCLE.indexOf(ga) + 1) % CYCLE.length] === gb) {
    return { relation: "advantage", multiplier: MULT.core, reason: ELEMENTS[a].label + " beats " + ELEMENTS[b].label };
  }
  if (CYCLE[(CYCLE.indexOf(gb) + 1) % CYCLE.length] === ga) {

   ============================================================ */

  /* Keep the caret where the user left it across a structural rebuild. */

  var selStart = focusKey && act.selectionStart != null ? act.selectionStart : null;

  liveNodes = [];

  var c = char();

     never drift out of step with whether a battle is actually running. */
  document.body.dataset.battle = (c && c.sessionActive) ? "1" : "0";

  app.appendChild(Header(c));
  if (c && c.current.incapacitated) {
    app.appendChild(h("div", {
      class: "banner",
      text: "Incapacitated. Recover with a Phoenix Fruit, or when the battle ends."
    }));
  }

  if (c) {
    var items = [
      { value: "character", label: "Character" },
      { value: "arsenal", label: "Arsenal" },
      { value: "inventory", label: "Inventory" },
      { value: "log", label: "Activity" }
    ];
    if (c.sessionActive) items.splice(3, 0, { value: "combat", label: "Combat" });
    if (S.tab === "combat" && !c.sessionActive) S.tab = "character";

    app.appendChild(h("div", { style: "margin-bottom:24px" }, [
      Tabs(items, S.tab, function (v) { S.tab = v; S.openMenu = null; render(); })
    ]));

    else if (S.tab === "arsenal") ArsenalTab(app, c);

  document.querySelectorAll(".overlay,.toast").forEach(function (n) { n.remove(); });
  if (S.toast) document.body.appendChild(h("div", { class: "toast", text: S.toast }));
  if (S.confirm) document.body.appendChild(ConfirmDialog());
  if (S.onboarding) document.body.appendChild(OnboardingDialog());

  if (focusKey) {

    if (next) {

function progField(c, key, label) {

function statCell(c, def, part) {
  var value = part === "up" ? num(c.base[def.attr]) : c.baseStats[def.key][part];
  var input = h("input", {
    class: "cell", inputmode: "numeric", value: String(value),

/* ---------------- Combat ---------------- */
function attackList(c) {
  var d = derived(c);
  var die = tierDie(c.progression.rank);
  var out = [];

  function build(row, kindLabel, hits, mpCost) {
    var bonus = sourceBonus(row.damageTypes, d);
    var m = matchup(row.element, S.target);
    var lines = [
      { label: kindLabel + " damage, normal", value: String(num(row.normal)) },
      { label: kindLabel + " damage, critical", value: String(num(row.crit)) },
      { label: sourceLabel(row.damageTypes), value: bonus ? "+" + bonus : "0" }
    ];
    if (row.dice) lines.push({ label: "Dice", value: row.dice });
    if (hits > 1) lines.push({ label: "Hits", value: "×" + hits });
    if (mpCost) lines.push({ label: "MP cost", value: String(mpCost) });
    return {
      name: row.name || "Unnamed", kindLabel: kindLabel, element: row.element,
      relation: m.relation, reason: m.reason, multiplier: m.multiplier, die: die,
      showBonus: m.relation === "advantage" && m.multiplier > 0,
      lines: lines,
      normal: (num(row.normal) + bonus) * hits,
      crit: (num(row.crit) + bonus) * hits
    };
  }

  c.weapons.forEach(function (w) { out.push(build(w, "Weapon", 1, 0)); });
  c.skills.forEach(function (s) {
    if (!s.normal && !s.crit && !s.damageTypes.length) return; /* utility, not an attack */
    out.push(build(s, "Skill", Math.max(1, num(s.hits) || 1), num(s.mpCost)));
  });
  return out;
}

function CombatTab(app, c) {
  var d = derived(c);

  function vessel(key, label, cls) {
    var max = key === "hp" ? d.maxHP : d.maxMP;
    var cur = c.current[key];
    var fill = max > 0 ? Math.max(0, Math.min(1, cur / max)) : 0;
    var tube = h("div", {
      class: "tube", role: "img",
      "aria-label": cur + " of " + max + " " + label
    }, [h("div", { class: "tube-fill " + cls, style: "--fill:" + fill })]);
    var lab = h("div", { class: "vessel-label" }, [
      h("b", { text: String(cur) }), " / " + max + " " + label
    ]);
    return h("div", { class: "vessel" }, [tube, lab]);
  }

  /* One number and its Apply button. Enter in the field applies too. */
  function quick(label, variant, disabled, apply) {
    var input = h("input", { inputmode: "numeric", value: "1", "aria-label": label });
    var run = function () {
      var n = Math.max(0, num(input.value));
      if (!n) return;
      apply(n);
    };
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); run(); }
    });
    return h("div", { class: "quick-field" }, [
      h("span", { class: "ci-label", text: label }),
      h("div", { class: "quick-row" }, [
        h("span", { class: "ci-inputbox" }, [input]),
        Button({ variant: variant, size: "sm", label: "Apply", disabled: disabled, onClick: run })
      ])
    ]);
  }

  var inc = c.current.incapacitated;
  app.appendChild(h("div", { class: "panel panel--tight" }, [
    h("div", { class: "vessels" }, [
      vessel("hp", "HP", "hp"),
      vessel("mp", "MP", "mp"),
      h("div", { class: "quick" }, [
        quick("Damage", "danger", inc, function (n) {
          var was = c.current.hp;
          mutate(function (x) {
            x.current.hp = Math.max(0, x.current.hp - n);
            x.current.incapacitated = x.current.hp === 0;
          }, function (x) {
            return { type: "damage", message: "Took " + (was - x.current.hp) + " damage"
              + (x.current.incapacitated ? ", down" : "") };
          });
        }),
        quick("Heal", "secondary", inc, function (n) {
          var was = c.current.hp;
          mutate(function (x) {
            x.current.hp = Math.min(derived(x).maxHP, x.current.hp + n);
          }, function (x) { return { type: "heal", message: "Healed " + (x.current.hp - was) }; });
        }),
        quick("Spend MP", "secondary", false, function (n) {
          var was = c.current.mp;
          mutate(function (x) { x.current.mp = Math.max(0, x.current.mp - n); },
            function (x) { return { type: "mp", message: "Spent " + (was - x.current.mp) + " MP" }; });
        }),
        quick("Restore MP", "secondary", false, function (n) {
          var was = c.current.mp;
          mutate(function (x) {
            x.current.mp = Math.min(derived(x).maxMP, x.current.mp + n);
          }, function (x) { return { type: "mp", message: "Restored " + (x.current.mp - was) + " MP" }; });
        })
      ])
    ]),
    h("div", { class: "grid g2", style: "align-items:end" }, [
      Select({
        label: "Enemy element",
        options: [{ value: "unknown", label: "Unknown" }].concat(
          elementOptions().filter(function (o) { return o.value !== "none"; })),
        value: S.target,
        onChange: function (v) { S.target = v; render(); }
      }),
      Select({
        label: "Your tier rank", options: opts(RANKS), value: c.progression.rank,
        onChange: function (v) {
          mutate(function (x) { x.progression.rank = v; },
            { type: "rank", message: "Tier rank set to " + v });
        }
      })
    ])
  ]));

  var attacks = attackList(c);
  if (!attacks.length) {
    app.appendChild(h("div", { class: "panel" }, [
      h("p", { class: "empty", text: "Nothing to attack with yet. Add a weapon or a damaging skill under Arsenal." })
    ]));
  }

  attacks.forEach(function (a) {
    var tone = a.relation === "advantage" ? "gold" : a.relation === "disadvantage" ? "danger" : "neutral";
    var headBits = [
      h("span", { style: "flex:1 1 180px;min-width:0;font-size:20px;line-height:28px;font-weight:500", text: a.name }),
      Badge("neutral", a.kindLabel)
    ];
    if (a.element !== "none") {
      headBits.push(Badge(
        a.element === "chaos" ? "danger" : a.element === "holy" ? "gold" : "lilac",
        ELEMENTS[a.element].label
      ));
    }
    if (S.target !== "unknown" && a.element !== "none") headBits.push(Badge(tone, a.relation));

    var card = h("div", { class: "panel panel--tight", style: "margin-bottom:12px" }, [
      h("div", { class: "rowtop" }, headBits),
      h("div", { style: "display:flex;flex-direction:column;gap:4px;margin-bottom:16px" },
        a.lines.map(function (l) {
          return h("div", { class: "breakline" }, [
            h("span", { text: l.label }), h("span", { text: l.value })
          ]);
        })),
      /* Advantage is stated as a formula. The dice are rolled at the table,
         so the sheet never rolls for you. */
      a.showBonus ? h("div", {
        style: "display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border-default)"
      }, [
        h("span", { style: "font-size:14px;color:var(--text-secondary)", text: a.reason + ", so roll your tier die once for this attack" }),
        h("span", {
          style: "font-size:16px;font-weight:500;color:var(--text-accent);font-variant-numeric:tabular-nums",
          text: "+ 1d" + a.die + " × " + a.multiplier
        })
      ]) : null,
      h("div", {
        class: "grid g3",
        style: "border-top:1px solid var(--accent-soft);padding-top:16px"
      }, [
        h("div", {}, [
          h("div", { class: "subhead", style: "letter-spacing:3px", text: "Normal" }),
          h("div", { class: "bignum", text: String(a.normal) })
        ]),
        h("div", {}, [
          h("div", { class: "subhead", style: "letter-spacing:3px;color:var(--text-accent)", text: "Critical" }),
          h("div", { class: "bignum", style: "color:var(--text-accent)", text: String(a.crit) })
        ])
      ])
    ]);
    app.appendChild(card);
  });

  /* Buffs and debuffs */
  var blist = h("div", {}, c.buffs.map(function (b) {
    return h("div", {
      style: "display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid rgba(194,163,104,0.12)"
    }, [
      Badge(b.kind === "debuff" ? "danger" : "moss", b.kind),
      h("span", { style: "flex:1 1 160px;min-width:0", text: b.name }),
      h("span", { style: "font-size:14px;color:var(--text-secondary)", text: b.duration || "No limit" }),
      Button({
        variant: "danger", size: "sm", label: "Remove",
        onClick: function () {
          mutate(function (x) { x.buffs = x.buffs.filter(function (r) { return r.id !== b.id; }); },
            { type: "effect", message: "Removed " + b.name });
        }
      })
    ]);
  }));
  if (!c.buffs.length) blist.appendChild(h("p", { class: "empty", text: "Nothing active." }));

  app.appendChild(h("div", { class: "panel", style: "margin-top:24px" }, [
    h("div", { class: "panel-head" }, [
      h("h2", { class: "panel-title", text: "Buffs and debuffs" }),
      h("span", { class: "panel-note", text: c.buffs.length === 1 ? "1 active" : c.buffs.length + " active" })
    ]),
    blist,
    h("div", { class: "grid g3", style: "margin-top:24px;align-items:end" }, [
      Select({
        label: "Kind",
        options: [{ value: "buff", label: "Buff" }, { value: "debuff", label: "Debuff" }],
        value: S.newBuff.kind,
        onChange: function (v) { S.newBuff.kind = v; render(); }
      }),
      Input({
        label: "Name", value: S.newBuff.name, placeholder: "Poisoned",
        onInput: function (v) { S.newBuff.name = v; }
      }),
      Input({
        label: "Duration", value: S.newBuff.duration, placeholder: "3 turns",
        onInput: function (v) { S.newBuff.duration = v; }
      }),
      Button({
        variant: "primary", full: true, label: "Add effect", iconLeft: plusIcon(),
        onClick: function () {
          if (!S.newBuff.name.trim()) { toast("Give the effect a name first."); return; }
          var b = { id: uid(), kind: S.newBuff.kind, name: S.newBuff.name.trim(), duration: S.newBuff.duration.trim() };
          S.newBuff = { kind: b.kind, name: "", duration: "" };
          mutate(function (x) { x.buffs.push(b); }, { type: b.kind, message: "Added " + b.kind + " " + b.name });
        }
      })
    ])
  ]));
}

/* ---------------- Log ---------------- */
function LogTab(app, c) {
  var lines = h("div", {}, c.log.map(function (e) {
    return h("div", { class: "logline" }, [
      h("span", { class: "logtime", text: new Date(e.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) }),
      h("span", { class: "logtype", text: e.type }),
      h("span", { style: "flex:1 1 220px;min-width:0", text: e.message })
    ]);
  }));
  if (!c.log.length) lines.appendChild(h("p", { class: "empty", text: "Nothing recorded yet." }));

  var noteInput = Input({
    label: "Note", value: S.note, placeholder: "Note what just happened",
    onInput: function (v) { S.note = v; }
  });

  app.appendChild(h("div", { class: "panel" }, [
    h("div", { class: "panel-head" }, [
      h("h2", { class: "panel-title", text: "Activity Log" }),
      Button({ variant: "secondary", size: "sm", label: "Undo last", onClick: doUndo })
    ]),
    h("div", { style: "display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px" }, [
      h("div", { style: "flex:1 1 280px;min-width:0" }, [noteInput]),
      Button({
        variant: "primary", size: "sm", label: "Add note", iconLeft: plusIcon(),
        onClick: function () {
          var n = S.note.trim();
          if (!n) return;
          S.note = "";
          mutate(function () {}, { type: "note", message: n });
        }
      })
    ]),
    lines
  ]));
}

/* ---------------- Overlays ---------------- */
function ConfirmDialog() {
  return h("div", { class: "overlay" }, [
    h("div", { class: "dialog", role: "dialog", "aria-modal": "true" }, [
      h("p", { style: "margin-bottom:24px", text: S.confirm.message }),
      h("div", { style: "display:flex;gap:12px;justify-content:flex-end" }, [
        Button({ variant: "ghost", label: "Cancel", onClick: function () { S.confirm = null; render(); } }),
        Button({
          variant: "primary", label: S.confirm.label,
          onClick: function () { var act = S.confirm.act; S.confirm = null; act(); }
        })
      ])
    ])
  ]);
}

function OnboardingDialog() {
  var canClose = !!(S.data && S.data.characters.length);
  var nameInput = Input({
    label: "Character name", value: S.newName, placeholder: "Who are they?",
    onInput: function (v) {
      S.newName = v;
      createBtn.disabled = !v.trim();
    }
  });
  var classInput = Input({
    label: "Class", value: S.newClass, placeholder: "What do they do?",
    onInput: function (v) { S.newClass = v; }
  });
  var createBtn = Button({
    variant: "primary", full: true, label: "Create character",
    disabled: !S.newName.trim(), onClick: doCreate
  });

  return h("div", { class: "overlay" }, [
    h("div", { class: "dialog", role: "dialog", "aria-modal": "true", "aria-label": "New character" }, [
      canClose ? h("button", {
        class: "dialog-close", "aria-label": "Close",
        onclick: function () { S.onboarding = false; render(); }
      }, [closeIcon()]) : null,
      h("h2", { class: "panel-title", style: "margin-bottom:8px", text: "New character" }),
      h("p", { class: "panel-note", style: "margin-bottom:24px", text: "You can change any of this later." }),
      h("div", { class: "grid" }, [nameInput, classInput, createBtn])
    ])
  ]);
}

/* ============================================================
   Actions
   ============================================================ */
function doCreate() {
  if (!S.newName.trim()) return;
  if (!S.data) S.data = { schemaVersion: 6, characters: [], activeId: null };
  var c = normalize({
    id: uid(),
    identity: { name: S.newName.trim(), class: S.newClass.trim(), element: "none" },
    weapons: [{ id: uid(), name: "Unarmed", damageTypes: ["armsPower"], normal: 0, crit: 0, element: "none" }],
    inventory: [
      { id: uid(), name: "HP Potion", type: "Consumable" },
      { id: uid(), name: "MP Potion", type: "Consumable" },
      { id: uid(), name: "Phoenix Fruit", type: "Consumable" }
    ]
  });
  var d = derived(c);
  c.current = { hp: d.maxHP, mp: d.maxMP, incapacitated: false };
  S.data.characters.push(c);
  S.data.activeId = c.id;
  S.onboarding = false;
  S.tab = "character";
  S.newName = ""; S.newClass = "";
  save();
  render();
}

function doDuplicate() {
  var c = char();
  if (!c) return;
  var copy = JSON.parse(JSON.stringify(c));
  copy.id = uid();
  copy.identity.name = (copy.identity.name || "Character") + " (copy)";
  S.data.characters.push(copy);
  S.data.activeId = copy.id;
  save();
  render();
}

function doDelete() {
  var c = char();
  if (!c) return;
  S.confirm = {
    message: "Delete " + (c.identity.name || "this character") + "? This cannot be undone.",
    label: "Delete",
    act: function () {
      S.data.characters = S.data.characters.filter(function (x) { return x.id !== c.id; });
      S.data.activeId = S.data.characters.length ? S.data.characters[0].id : null;
      S.onboarding = !S.data.characters.length;
      save();
      render();
    }
  };
  render();
}

function toggleSession() {
  var c = char();
  if (!c) return;
  if (c.sessionActive) {
    S.confirm = {
      message: "End the battle? HP and MP are restored and the Combat tab closes.",
      label: "End battle",
      act: function () {
        S.target = "unknown"; S.tab = "character"; S.openMenu = null;
        mutate(function (x) {
          var d = derived(x);
          x.current = { hp: d.maxHP, mp: d.maxMP, incapacitated: false };
          x.sessionActive = false;
        }, { type: "battle", message: "Battle ended" });
      }
    };
    render();
  } else {
    S.target = "unknown"; S.tab = "combat"; S.openMenu = null;
    mutate(function (x) {
      var d = derived(x);
      x.current = { hp: d.maxHP, mp: d.maxMP, incapacitated: false };
      x.sessionActive = true;
    }, { type: "battle", message: "Battle started" });
  }
}

function doUndo() {
  var c = char();
  if (!c) return;
  var idx = -1;
  for (var i = 0; i < c.log.length; i++) { if (c.log[i].prev) { idx = i; break; } }
  if (idx === -1) { toast("Nothing to undo."); return; }
  var restored = JSON.parse(c.log[idx].prev);
  var keptLog = c.log.slice(idx + 1);
  Object.keys(restored).forEach(function (k) { if (k !== "log") c[k] = restored[k]; });
  c.log = keptLog;
  save();
  render();
}

function doExport() {
  var blob = new Blob([JSON.stringify(S.data, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "ethyronn-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function doImport(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    var parsed;
    try { parsed = JSON.parse(r.result); }
    catch (err) { toast("That file is not valid JSON."); return; }
    var data = parsed && parsed.schemaVersion === 6 ? parsed : migrate(parsed || {});
    data.characters = (data.characters || []).map(normalize);
    if (!data.characters.length) { toast("No characters in that file."); return; }
    data.activeId = data.activeId || data.characters[0].id;
    S.data = data;
    S.onboarding = false;
    save();
    toast("Imported " + data.characters.length + (data.characters.length === 1 ? " character." : " characters."));
  };
  r.readAsText(file);
  e.target.value = "";
}

/* ============================================================
   Boot
   ============================================================ */
/* A click anywhere outside an open multi-select closes it. */
document.addEventListener("click", function () {
  if (S.openMenu) { S.openMenu = null; render(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (S.openMenu) { S.openMenu = null; render(); return; }
  if (S.confirm) { S.confirm = null; render(); return; }
  if (S.onboarding && S.data && S.data.characters.length) { S.onboarding = false; render(); }
});
/* A file input inside a label is not reachable by keyboard on its own. */
document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  var el = document.activeElement;
  if (!el || !el.classList || !el.classList.contains("file-btn")) return;
  var input = el.querySelector("input[type=file]");
  if (input) { e.preventDefault(); input.click(); }
});

function boot() {
  var data = read(KEY);
  if (!data) {
    for (var i = 0; i < OLD_KEYS.length; i++) {
      var legacy = read(OLD_KEYS[i]);
      if (legacy) { data = migrate(legacy); break; }
    }
  }
  if (!data || !data.characters || !data.characters.length) {
    S.data = { schemaVersion: 6, characters: [], activeId: null };
    S.onboarding = true;
    render();
    return;
  }
  data.schemaVersion = 6;
  data.characters = data.characters.map(normalize);
  if (!data.activeId) data.activeId = data.characters[0].id;
  S.data = data;
  save();
  render();
}

boot();

/* Exposed for the test harness; harmless in the browser. */
window.__ethyronn = {
  S: S, derived: derived, matchup: matchup, migrate: migrate, normalize: normalize,
  sourceBonus: sourceBonus, sourceLabel: sourceLabel, tierDie: tierDie,
  BASE_STATS: BASE_STATS, ATTRS: ATTRS, render: render, char: char, num: num
};

})();
</script>
</body>
</html>
